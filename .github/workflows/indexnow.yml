name: Notify IndexNow

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entity-docs-indexnow
  cancel-in-progress: true

jobs:
  notify:
    name: Notify participating search engines
    runs-on: ubuntu-latest
    steps:
      - name: Allow GitHub Pages time to publish
        run: sleep 90

      - name: Build current URL list from published sitemaps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          core = [
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/",
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/v342/",
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/qualification/",
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/standards/",
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/standards/entity-authority-provenance.html",
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/developer/",
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/operator/",
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/protocol/",
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/economy/",
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/security/",
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/domains/",
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/feed.xml",
          ]

          sitemap_urls = [
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/sitemap-guides.xml",
              "https://blackmore-technology-group.github.io/ENTITY-DOCS/sitemap-discovery.xml",
          ]

          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          discovered_urls = []
          for sitemap in sitemap_urls:
              with urllib.request.urlopen(sitemap, timeout=30) as response:
                  root = ET.fromstring(response.read())
              discovered_urls.extend(
                  node.text.strip()
                  for node in root.findall("sm:url/sm:loc", ns)
                  if node.text and node.text.strip()
              )

          urls = list(dict.fromkeys(core + discovered_urls))
          with open("urls.json", "w", encoding="utf-8") as f:
              json.dump(urls, f, ensure_ascii=False, indent=2)
          print(f"Prepared {len(urls)} URLs for IndexNow")
          PY

      - name: Submit current ENTITY documentation URLs to IndexNow
        env:
          INDEXNOW_KEY: c85c1cc55ba5df3c66f6441c2f702d6f
          HOST: blackmore-technology-group.github.io
          KEY_LOCATION: https://blackmore-technology-group.github.io/ENTITY-DOCS/c85c1cc55ba5df3c66f6441c2f702d6f.txt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          with open("urls.json", encoding="utf-8") as f:
              urls = json.load(f)

          payload = {
              "host": os.environ["HOST"],
              "key": os.environ["INDEXNOW_KEY"],
              "keyLocation": os.environ["KEY_LOCATION"],
              "urlList": urls,
          }
          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          PY

          http_code=$(curl --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 60 \
            -sS -o indexnow-response.txt -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @payload.json)

          echo "IndexNow HTTP status: ${http_code}"
          cat indexnow-response.txt || true

          case "${http_code}" in
            200|202)
              echo 'IndexNow submission accepted.'
              ;;
            429)
              echo 'IndexNow rate-limited this run; a future documentation push can retry.'
              ;;
            *)
              echo 'IndexNow submission failed.' >&2
              exit 1
              ;;
          esac
